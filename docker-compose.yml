services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: nestjs_auth_base
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  mailpit:            # xem mail gửi ra tại http://localhost:8025
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025']

volumes:
  pgdata: